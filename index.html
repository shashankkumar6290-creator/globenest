<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GlobeNest - Global Chat</title>
    
    <!-- Include Firebase Libraries -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #f0f2f5; display: flex; justify-content: center; align-items: center; height: 100vh; }
        
        /* App Container */
        #app-container { width: 100%; max-width: 450px; height: 100vh; background: white; display: flex; flex-direction: column; box-shadow: 0 0 10px rgba(0,0,0,0.1); }
        @media (min-width: 450px) { #app-container { height: 90vh; border-radius: 12px; overflow: hidden; } }
        
        /* Header */
        .header { background: #0078ff; color: white; padding: 15px; text-align: center; font-size: 1.2rem; font-weight: bold; }
        
        /* Login Screen */
        #login-screen { display: flex; flex-direction: column; justify-content: center; align-items: center; flex: 1; padding: 30px; }
        #login-screen h2 { margin-bottom: 20px; color: #333; }
        .input-field { width: 100%; padding: 12px; margin-bottom: 15px; border: 1px solid #ccc; border-radius: 8px; font-size: 1rem; }
        .btn { width: 100%; padding: 12px; background: #0078ff; color: white; border: none; border-radius: 8px; font-size: 1rem; cursor: pointer; font-weight: bold; }
        .btn:hover { background: #0056b3; }

        /* Chat Screen */
        #chat-screen { display: none; flex-direction: column; flex: 1; height: 100%; overflow: hidden; }
        #message-area { flex: 1; padding: 15px; overflow-y: auto; background: #e5ddd5; display: flex; flex-direction: column; gap: 10px; }
        
        /* Chat Bubbles */
        .message { max-width: 80%; padding: 8px 12px; border-radius: 8px; font-size: 0.95rem; position: relative; word-break: break-word; display: flex; flex-direction: column; }
        .message .username { font-size: 0.75rem; font-weight: bold; color: #0078ff; margin-bottom: 3px; display: flex; justify-content: space-between; align-items: center; gap: 10px; }
        .message.sent { background: #d9fdd3; align-self: flex-end; }
        .message.sent .username { display: none; }
        .message.received { background: white; align-self: flex-start; }
        
        /* Action buttons inside bubbles */
        .action-links { display: flex; gap: 8px; font-size: 0.7rem; margin-top: 4px; border-top: 1px dashed #ddd; padding-top: 4px; justify-content: flex-end; }
        .action-links span { cursor: pointer; color: #666; font-weight: bold; }
        .action-links span.report-btn { color: #cc0000; }
        .action-links span.block-btn { color: #555; }
        .action-links span:hover { text-decoration: underline; }
        
        /* Input Bar */
        .input-bar { display: flex; padding: 10px; background: #f0f2f5; border-top: 1px solid #ddd; }
        #message-input { flex: 1; padding: 10px; border: 1px solid #ccc; border-radius: 20px; outline: none; font-size: 1rem; padding-left: 15px; }
        #send-btn { background: #0078ff; color: white; border: none; width: 40px; height: 40px; border-radius: 50%; margin-left: 8px; cursor: pointer; font-size: 1.2rem; display: flex; align-items: center; justify-content: center; }
    </style>
</head>
<body>

<div id="app-container">
    <div class="header">🌍 GlobeNest</div>

    <!-- LOGIN VIEW -->
    <div id="login-screen">
        <h2>Welcome to GlobeNest</h2>
        <input type="text" id="username-input" class="input-field" placeholder="Enter a global username...">
        <button class="btn" onclick="joinChat()">Join Global Chat</button>
    </div>

    <!-- CHAT VIEW -->
    <div id="chat-screen">
        <div id="message-area"></div>
        <div class="input-bar">
            <input type="text" id="message-input" placeholder="Type a message...">
            <button id="send-btn" onclick="sendMessage()">➔</button>
        </div>
    </div>
</div>

<script>
    // // Import the functions you need from the SDKs you need
import { initializeApp } from "firebase/app";
import { getAnalytics } from "firebase/analytics";
// TODO: Add SDKs for Firebase products that you want to use
// https://firebase.google.com/docs/web/setup#available-libraries

// Your web app's Firebase configuration
// For Firebase JS SDK v7.20.0 and later, measurementId is optional
const firebaseConfig = {
  apiKey: "AIzaSyBpG_GwVzTdURdLlkYgZowTuD75QnE-pug",
  authDomain: "globenest-513ef.firebaseapp.com",
  projectId: "globenest-513ef",
  storageBucket: "globenest-513ef.firebasestorage.app",
  messagingSenderId: "473034861207",
  appId: "1:473034861207:web:5efa886de4df51c8b557d2",
  measurementId: "G-PX904HJH9J"
};

// Initialize Firebase
const app = initializeApp(firebaseConfig);
const analytics = getAnalytics(app);
    const firebaseConfig = {
        apiKey: "YOUR_API_KEY",
        authDomain: "YOUR_PROJECT_ID.firebaseapp.com",
        databaseURL: "https://YOUR_PROJECT_ID-default-rtdb.firebaseio.com",
        projectId: "YOUR_PROJECT_ID",
        storageBucket: "YOUR_PROJECT_ID.appspot.com",
        messagingSenderId: "YOUR_SENDER_ID",
        appId: "YOUR_APP_ID"
    };

    // Initialize Firebase
    firebase.initializeApp(firebaseConfig);
    const database = firebase.database();
    
    let currentUsername = "";
    let blockedUsers = JSON.parse(localStorage.getItem("blockedUsers")) || [];

    // Join App Logic
    function joinChat() {
        const nameInput = document.getElementById("username-input").value.trim();
        if (nameInput === "") {
            alert("Please enter a username!");
            return;
        }
        currentUsername = nameInput;
        document.getElementById("login-screen").style.display = "none";
        document.getElementById("chat-screen").style.display = "flex";
        
        // Start listening for global messages
        listenForMessages();
    }

    // Send Message Logic
    function sendMessage() {
        const msgInput = document.getElementById("message-input");
        const messageText = msgInput.value.trim();
        
        if (messageText === "") return;

        // Push data to Firebase cloud database
        database.ref("global_messages").push({
            username: currentUsername,
            text: messageText,
            timestamp: Date.now()
        });

        msgInput.value = ""; // Clear typing box
    }

    // Listen for Realtime Messages
    function listenForMessages() {
        const messageArea = document.getElementById("message-area");
        messageArea.innerHTML = ""; // Clear area
        
        // Detach existing listeners to avoid duplicate appended items
        database.ref("global_messages").off();
        
        database.ref("global_messages").limitToLast(50).on("child_added", (snapshot) => {
            const data = snapshot.val();
            const messageId = snapshot.key;
            
            // 🛡️ BLOCK RULE: If user is on your blocked list, hide their message completely
            if (blockedUsers.includes(data.username)) {
                return; 
            }
            
            const messageElement = document.createElement("div");
            messageElement.classList.add("message");

            // Text sanitization
            const safeUsername = document.createTextNode(data.username).textContent;
            const safeText = document.createTextNode(data.text).textContent;
            
            if (data.username === currentUsername) {
                messageElement.classList.add("sent");
                messageElement.innerHTML = `<span>${safeText}</span>`;
            } else {
                messageElement.classList.add("received");
                messageElement.innerHTML = `
                    <span class="username">${safeUsername}</span>
                    <span>${safeText}</span>
                    <div class="action-links">
                        <span class="block-btn">🚫 Block</span>
                        <span class="report-btn">🚩 Report</span>
                    </div>
                `;

                // Safe event listeners (avoids inline script injection breaks)
                const blockBtn = messageElement.querySelector(".block-btn");
                blockBtn.addEventListener("click", () => blockUser(data.username));

                const reportBtn = messageElement.querySelector(".report-btn");
                reportBtn.addEventListener("click", () => reportMessage(messageId, data.username, data.text));
            }
            
            messageArea.appendChild(messageElement);
            messageArea.scrollTop = messageArea.scrollHeight; // Auto-scroll
        });
    }

    // 🚫 Block User System
    function blockUser(username) {
        if (confirm(`Are you sure you want to block ${username}? You will no longer see their messages.`)) {
            blockedUsers.push(username);
            localStorage.setItem("blockedUsers", JSON.stringify(blockedUsers));
            alert(`${username} has been blocked.`);
            // Reload message area to instantly hide their messages
            listenForMessages();
        }
    }

    // 🚩 Report Message System
    function reportMessage(msgId, username, messageText) {
        if (confirm("Do you want to report this message for review by the admin?")) {
            database.ref("reported_messages").push({
                messageId: msgId,
                reportedUser: username,
                flaggedBy: currentUsername,
                text: messageText,
                timestamp: Date.now()
            });
            alert("Thank you. The message has been reported to the administrator.");
        }
    }

    // Allow pressing "Enter" key to send message
    document.getElementById("message-input").addEventListener("keypress", function(e) {
        if (e.key === 'Enter') sendMessage();
    });

    document.getElementById("username-input").addEventListener("keypress", function(e) {
        if (e.key === 'Enter') joinChat();
    });
</script>

</body>
</html>
